clusterName: platform-pg
instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:17.10-standard-trixie

storage:
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Each entry creates a login role (password from the referenced basic-auth Secret)
# and a database owned by that role.
databases:
  - name: lakekeeper
    owner: lakekeeper
    passwordSecret: lakekeeper-db
