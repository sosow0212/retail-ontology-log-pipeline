[project]
name = "retail-pipeline"
version = "0.1.0"
description = "Data pipeline for the retail supply-chain ontology project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=21",
    "pydantic>=2.10",
    "pydantic-settings>=2.10",
    "pyiceberg[pyarrow]>=0.12,<0.13",
    "requests>=2.32",
]

[project.scripts]
retail-pipeline = "retail_pipeline.cli:main"

[dependency-groups]
dev = [
    "pyiceberg[sql-sqlite]>=0.12,<0.13",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
